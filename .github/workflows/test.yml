name: test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: test (Elixir ${{ matrix.elixir }} | OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.16'
            otp: '26'
          - elixir: '1.15'
            otp: '26'
          - elixir: '1.14'
            otp: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Run tests
        run: mix test
